<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Desktop Organizer</title>
<style>
  :root{
    --bg0:#080a16; --bg1:#0d1024;
    --glass:rgba(255,255,255,.045);
    --glass-brd:rgba(255,255,255,.10);
    --txt:#eef0ff; --dim:#9aa0c4; --mute:#666e99;
    --pri:#6d5efc; --pri2:#a855f7; --cyan:#22d3ee;
    --ok:#34d399; --warn:#fbbf24; --bad:#fb7185;
    --r:16px;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font:14px/1.55 "Segoe UI Variable Display","Segoe UI","Microsoft YaHei UI",system-ui,sans-serif;
    color:var(--txt); background:var(--bg0);
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:-20%; z-index:-2;
    background:
      radial-gradient(46vw 46vw at 12% 8%, rgba(109,94,252,.32), transparent 62%),
      radial-gradient(40vw 40vw at 88% 4%, rgba(168,85,247,.26), transparent 62%),
      radial-gradient(50vw 50vw at 70% 96%, rgba(34,211,238,.16), transparent 60%),
      linear-gradient(160deg,var(--bg1),var(--bg0) 70%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(70% 70% at 50% 40%,#000 40%,transparent 100%);
    -webkit-mask-image:radial-gradient(70% 70% at 50% 40%,#000 40%,transparent 100%);
  }

  .app{height:100vh; display:flex; flex-direction:column; padding:14px 16px 16px; gap:12px}

  /* ---- 顶栏 ---- */
  header{
    display:flex; align-items:center; gap:16px;
    padding:12px 16px; border-radius:var(--r);
    background:var(--glass); border:1px solid var(--glass-brd);
    backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 8px 32px rgba(0,0,0,.36), inset 0 1px 0 rgba(255,255,255,.07);
    flex:none;
  }
  .logo{
    width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--pri),var(--pri2));
    box-shadow:0 6px 20px rgba(109,94,252,.5), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .logo svg{width:19px;height:19px}
  h1{font-size:15px; font-weight:650; letter-spacing:.2px; line-height:1.2}
  .sub{font-size:11.5px; color:var(--dim); margin-top:2px}
  .rootbox{
    margin-left:auto; display:flex; align-items:center; gap:9px;
    padding:7px 13px; border-radius:10px; background:rgba(255,255,255,.04);
    border:1px solid var(--glass-brd); font-size:12px; color:var(--dim);
    max-width:38vw;
  }
  .rootbox b{color:var(--cyan); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none}

  .permit{
    font:inherit; font-size:11.5px; padding:6px 12px; border-radius:10px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; flex:none; width:auto; white-space:nowrap;
    background:rgba(255,255,255,.05); color:var(--dim);
    border:1px solid var(--glass-brd); transition:.16s;
  }
  .permit .led{width:7px;height:7px;border-radius:50%;background:#5b6275;flex:none;transition:.16s}
  .permit:hover{background:rgba(109,94,252,.16); color:#d8d3ff}
  .permit.on{background:rgba(34,211,238,.14); color:#a5f3fc; border-color:rgba(34,211,238,.42)}
  .permit.on .led{background:var(--cyan); box-shadow:0 0 10px var(--cyan)}
  /* 一键整理图标：下拉 + 按钮 + 撤销。都覆盖全局 button{width:100%}。 */
  .layoutbar{display:inline-flex; align-items:center; gap:6px; flex:none; white-space:nowrap}
  .layoutbar select{
    font:inherit; font-size:11.5px; padding:6px 8px; border-radius:10px; cursor:pointer;
    background:rgba(255,255,255,.05); color:var(--dim);
    border:1px solid var(--glass-brd); width:auto; max-width:150px;
  }
  .layoutbar select:hover{color:#d8d3ff; border-color:rgba(109,94,252,.42)}
  /* 复合策略：一颗键一个 chip，多选后按点击顺序叠加 */
  .keychips{
    display:inline-flex; align-items:center; gap:4px; flex:none;
    padding:3px; border-radius:11px; background:rgba(255,255,255,.04);
    border:1px solid var(--glass-brd);
  }
  .keychip{
    font:inherit; font-size:11px; padding:4px 9px; border-radius:8px; cursor:pointer;
    width:auto; display:inline-flex; align-items:center; white-space:nowrap;
    background:transparent; color:var(--dim); border:1px solid transparent; transition:.15s;
  }
  .keychip:hover{color:#d8d3ff; background:rgba(109,94,252,.14)}
  .keychip.on{background:rgba(34,211,238,.16); color:#a5f3fc; border-color:rgba(34,211,238,.38)}
  .keychip .ord{
    margin-left:5px; font-size:10px; opacity:.85;
    font-variant-numeric:tabular-nums;
  }
  /* 按类别批量勾选 */
  .catpick{display:inline-flex; align-items:center; gap:6px; flex:none}
  .catpick select{
    font:inherit; font-size:12px; padding:7px 9px; border-radius:10px; cursor:pointer;
    background:rgba(255,255,255,.05); color:var(--dim);
    border:1px solid var(--glass-brd); width:auto; max-width:150px;
  }
  .catpick select:hover{color:#d8d3ff; border-color:rgba(109,94,252,.42)}
  .toast .undo{
    margin-left:10px; font-size:11.5px; padding:3px 10px; border-radius:8px; cursor:pointer;
    width:auto; display:inline-flex; align-items:center;
    background:rgba(34,211,238,.16); color:#a5f3fc; border:1px solid rgba(34,211,238,.42);
  }

  /* ---- 三栏骨架 ---- */
  .shell{
    flex:1; min-height:0; display:grid;
    grid-template-columns:236px minmax(0,1fr) 340px;
    gap:12px;
  }

  .panel{
    display:flex; flex-direction:column; min-height:0; overflow:hidden;
    border-radius:var(--r); background:var(--glass); border:1px solid var(--glass-brd);
    box-shadow:0 8px 32px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .panel-hd{
    display:flex; align-items:center; gap:10px; padding:11px 14px;
    border-bottom:1px solid rgba(255,255,255,.07); flex:none;
  }
  .panel-hd h2{
    font-size:12.5px; font-weight:600; letter-spacing:.4px; color:var(--dim);
    text-transform:uppercase; white-space:nowrap; flex:none;
  }
  .count{
    font-size:11px; padding:1.5px 8px; border-radius:999px; white-space:nowrap; flex:none;
    background:rgba(109,94,252,.20); color:#c7c0ff; border:1px solid rgba(109,94,252,.34);
  }
  .spacer{flex:1}
  .mini{
    font:inherit; font-size:11.5px; padding:3px 10px; border-radius:8px; cursor:pointer;
    background:rgba(255,255,255,.06); color:var(--dim); white-space:nowrap; flex:none;
    /* 覆盖全局 button{width:100%;display:flex}，否则小按钮会被拉成整行 */
    width:auto; display:inline-flex; justify-content:center;
    border:1px solid var(--glass-brd); transition:.14s;
  }
  .mini:hover:not(:disabled){background:rgba(109,94,252,.20); color:#d8d3ff; border-color:rgba(109,94,252,.42)}
  .mini:disabled{opacity:.4; cursor:not-allowed}

  /* ---- 左栏：空间占用 + 类别筛选 ---- */
  .nav{display:flex; flex-direction:column; gap:12px; min-height:0}
  .donutwrap{display:grid; place-items:center; padding:16px 0 6px; flex:none}
  .donut{
    width:150px; height:150px; border-radius:50%; position:relative;
    background:conic-gradient(rgba(255,255,255,.08) 0turn, rgba(255,255,255,.08) 1turn);
    box-shadow:0 10px 30px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .donut-hole{
    position:absolute; inset:26px; border-radius:50%;
    background:rgba(12,14,30,.96); display:grid; place-items:center; text-align:center;
    border:1px solid rgba(255,255,255,.07);
  }
  .donut-hole b{display:block; font-size:15px; font-weight:650; letter-spacing:-.2px;
    background:linear-gradient(135deg,#fff,#b9b2ff); -webkit-background-clip:text; background-clip:text; color:transparent}
  .donut-hole span{font-size:10px; color:var(--mute); letter-spacing:.4px}

  .legend{flex:1; overflow-y:auto; padding:6px 8px 10px; min-height:0}
  .legend::-webkit-scrollbar{width:8px}
  .legend::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:99px}
  .catrow{
    display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:9px;
    cursor:pointer; font-size:12px; color:var(--dim); transition:.14s;
  }
  .catrow:hover{background:rgba(255,255,255,.06); color:var(--txt)}
  .catrow.on{background:linear-gradient(90deg,rgba(109,94,252,.22),rgba(168,85,247,.08)); color:#d8d3ff}
  .swatch{width:9px;height:9px;border-radius:3px;flex:none}
  .catrow .num{margin-left:auto; font-size:11px; color:var(--mute); white-space:nowrap}

  /* ---- 中栏：工作台 ---- */
  .work{min-width:0}
  .tools{
    display:flex; align-items:center; gap:8px; padding:9px 14px; flex:none;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .tools .search{
    flex:1; min-width:0; display:flex; align-items:center; gap:7px;
    padding:5px 10px; border-radius:9px;
    background:rgba(255,255,255,.045); border:1px solid var(--glass-brd);
    transition:.16s;
  }
  .tools .search:focus-within{border-color:rgba(109,94,252,.55); background:rgba(109,94,252,.10)}
  .tools .search svg{width:13px; height:13px; flex:none; color:var(--mute)}
  .tools .search input{
    flex:1; min-width:0; background:none; border:0; outline:none; color:var(--txt);
    font:inherit; font-size:12px; padding:0;
  }
  .tools .search input::placeholder{color:var(--mute)}
  .tools select{
    font:inherit; font-size:11.5px; padding:5px 8px; border-radius:9px; cursor:pointer;
    background:rgba(255,255,255,.045); color:var(--dim);
    border:1px solid var(--glass-brd); outline:none; flex:none; width:auto;
  }
  .tools select:hover{background:rgba(109,94,252,.16); color:#d8d3ff}

  /* 进度条：用户只要一个百分比 */
  .prog{
    display:flex; align-items:center; gap:10px; padding:8px 14px; flex:none;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .prog-bar{flex:1; height:6px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden}
  .prog-bar i{
    display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg,var(--pri),var(--cyan));
    transition:width .22s ease;
  }
  .prog-hint{font-size:11px; color:var(--mute); white-space:nowrap; flex:none}

  .bulk{
    display:flex; align-items:center; gap:8px; padding:8px 14px; flex:none;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .bulk input{
    flex:1; min-width:0; font:inherit; font-size:12px; padding:6px 10px; border-radius:9px;
    color:var(--txt); border:1px solid var(--glass-brd); background:rgba(0,0,0,.28); outline:none;
  }
  .bulk input:focus{border-color:rgba(109,94,252,.6); box-shadow:0 0 0 3px rgba(109,94,252,.14)}

  .thead,.row{
    display:grid; grid-template-columns:26px 1fr 74px 92px 64px 26px;
    align-items:center; gap:10px; padding:0 14px;
  }
  .thead{
    height:32px; flex:none; font-size:11px; letter-spacing:.5px;
    color:var(--mute); text-transform:uppercase; border-bottom:1px solid rgba(255,255,255,.05);
  }
  .list{flex:1; overflow-y:auto; overflow-x:hidden; padding:6px 0; min-height:0}
  .list::-webkit-scrollbar{width:9px}
  .list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:99px; border:2px solid transparent; background-clip:padding-box}
  .list::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.2); background-clip:padding-box}

  .row{
    min-height:44px; border-radius:10px; margin:2px 8px; padding:6px 10px;
    border:1px solid transparent; cursor:default; transition:.14s;
  }
  .row:hover{background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.08)}
  .row.on{background:linear-gradient(90deg,rgba(109,94,252,.17),rgba(168,85,247,.07)); border-color:rgba(109,94,252,.42)}
  .row.skip{opacity:.42}

  .cb{
    width:17px;height:17px;border-radius:5px;flex:none;cursor:pointer;
    border:1.5px solid rgba(255,255,255,.26); background:rgba(0,0,0,.24);
    display:grid; place-items:center; transition:.14s;
  }
  .row.on .cb{background:linear-gradient(135deg,var(--pri),var(--pri2)); border-color:transparent}
  .cb svg{width:11px;height:11px;opacity:0;transition:.14s}
  .row.on .cb svg{opacity:1}

  .fname{min-width:0}
  .fname b{display:block; font-weight:520; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .fname span{display:block; font-size:11px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  .tag{
    font-size:11px; padding:2px 8px; border-radius:7px; text-align:center; white-space:nowrap;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.09); color:#dfe2ff;
  }
  .tag.h{color:#ffd9a8; border-color:rgba(251,191,36,.34); background:rgba(251,191,36,.12)}
  .tag.m{color:#b8e8ff; border-color:rgba(34,211,238,.30); background:rgba(34,211,238,.10)}
  .tag.l{color:#c9cbe4; border-color:rgba(255,255,255,.12)}

  .conf{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--dim)}
  .bar{flex:1; height:4px; border-radius:99px; background:rgba(255,255,255,.10); overflow:hidden; min-width:22px}
  .bar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,var(--pri),var(--cyan))}
  .bar i.low{background:linear-gradient(90deg,#fb7185,#fbbf24)}

  .edit{
    width:24px;height:24px;border-radius:7px;display:grid;place-items:center;cursor:pointer;
    color:var(--mute); transition:.14s;
  }
  .edit:hover{background:rgba(255,255,255,.1); color:var(--txt)}
  .edit svg{width:13px;height:13px}

  .btnrow{
    display:flex; gap:8px; padding:10px 14px; flex:none;
    border-top:1px solid rgba(255,255,255,.06); background:rgba(0,0,0,.16);
  }
  .btnrow button{width:auto; flex:1; justify-content:center; font-size:12.5px; padding:9px 8px}

  button{
    font:inherit; width:100%; padding:10px 14px; border-radius:11px; cursor:pointer;
    border:1px solid var(--glass-brd); background:rgba(255,255,255,.05); color:var(--txt);
    display:flex; align-items:center; gap:9px; transition:.15s; text-align:left; font-size:13px;
  }
  button:hover:not(:disabled){background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.2); transform:translateY(-1px)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.38; cursor:not-allowed}
  button svg{width:15px;height:15px;flex:none;opacity:.85}

  button.primary{
    background:linear-gradient(135deg,var(--pri),var(--pri2)); border-color:transparent; font-weight:600;
    box-shadow:0 8px 22px rgba(109,94,252,.36), inset 0 1px 0 rgba(255,255,255,.28);
  }
  button.primary:hover:not(:disabled){box-shadow:0 10px 28px rgba(109,94,252,.5)}
  button.danger{border-color:rgba(251,113,133,.34); color:#ffc7d0; background:rgba(251,113,133,.09)}
  button.danger:hover:not(:disabled){background:rgba(251,113,133,.17)}

  /* ---- 右栏：AI 顾问 + 统计 + 日志 ---- */
  /* 右栏内容多，必须能滚：否则「让 AI 提建议」「一键采纳」会被裁到可视区外 */
  .copilot{display:flex; flex-direction:column; gap:10px; min-height:0; overflow-y:auto; padding-right:2px}
  .copilot::-webkit-scrollbar{width:8px}
  .copilot::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:99px}
  .copilot > .panel{flex:none}
  .aibody{padding:11px 12px 12px; display:flex; flex-direction:column; gap:8px}
  .field{display:flex; flex-direction:column; gap:4px}
  .field label{font-size:10.5px; color:var(--dim); letter-spacing:.4px; white-space:nowrap}
  select,input[type=text],input[type=password]{
    font:inherit; width:100%; padding:8px 10px; border-radius:9px; color:var(--txt);
    border:1px solid rgba(255,255,255,.14); background:rgba(0,0,0,.34); outline:none; font-size:12px;
  }
  select:focus,input[type=text]:focus,input[type=password]:focus{
    border-color:rgba(109,94,252,.7); box-shadow:0 0 0 3px rgba(109,94,252,.16);
  }
  option{background:#14162a}
  .ai-list{
    flex:1; min-height:80px; max-height:34vh; overflow-y:auto;
    border-radius:10px; background:rgba(0,0,0,.24); border:1px solid var(--glass-brd);
    padding:6px; display:flex; flex-direction:column; gap:5px;
  }
  .ai-list::-webkit-scrollbar{width:7px}
  .ai-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:99px}
  .sug{padding:6px 8px; border-radius:8px; background:rgba(255,255,255,.04); font-size:11.5px; line-height:1.45}
  .sug b{display:block; font-weight:520; color:#dfe2ff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .sug span{color:var(--mute)}
  .sug .to{color:var(--cyan)}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:none}
  .stat{padding:10px 12px; border-radius:12px; background:rgba(255,255,255,.045); border:1px solid var(--glass-brd)}
  .stat b{display:block; font-size:18px; font-weight:650; letter-spacing:-.3px;
    background:linear-gradient(135deg,#fff,#b9b2ff); -webkit-background-clip:text; background-clip:text; color:transparent}
  .stat span{font-size:10.5px; color:var(--mute); letter-spacing:.3px}

  .log{flex:1; min-height:90px; padding:10px 12px; border-radius:12px; background:rgba(0,0,0,.26);
    border:1px solid var(--glass-brd); font:11.5px/1.65 "Cascadia Mono",Consolas,monospace;
    color:var(--dim); overflow-y:auto; white-space:pre-wrap; word-break:break-all}
  .log::-webkit-scrollbar{width:7px}
  .log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:99px}
  .log .ok{color:var(--ok)} .log .warn{color:var(--warn)} .log .bad{color:var(--bad)} .log .t{color:var(--mute)}

  /* ---- 改判弹窗 ---- */
  .modal{position:fixed; inset:0; display:none; place-items:center; z-index:50; background:rgba(4,6,16,.66)}
  .modal.on{display:grid}
  .card{
    width:392px; padding:20px; border-radius:20px; background:rgba(20,22,42,.97);
    border:1px solid rgba(255,255,255,.13); box-shadow:0 30px 80px rgba(0,0,0,.66);
  }
  .card h4{font-size:14px; font-weight:640; margin-bottom:3px}
  .card p{font-size:11.5px; color:var(--mute); margin-bottom:16px; word-break:break-all}
  .card .field{margin-bottom:12px}
  .cardbtns{display:flex; gap:8px; margin-top:18px}
  .cardbtns button{justify-content:center}

  .empty{padding:54px 20px; text-align:center; color:var(--mute); font-size:13px}
  .empty svg{width:42px;height:42px;opacity:.3;margin-bottom:10px}
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translate(-50%,20px); opacity:0;
    padding:10px 20px; border-radius:11px; font-size:12.5px; pointer-events:none;
    background:rgba(24,26,48,.97); border:1px solid rgba(255,255,255,.15);
    box-shadow:0 14px 40px rgba(0,0,0,.56); transition:.24s; z-index:99;
  }
  .toast.on{opacity:1; transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
      </svg>
    </div>
    <div>
      <h1>Desktop Organizer</h1>
      <div class="sub">AI 给建议 · 人来拍板 · 每一步都能回滚</div>
    </div>
    <button class="permit" id="btnPermit" title="默认关闭：不加锁就不能整理真实桌面">
      <span class="led"></span><span id="permitText">用户目录写入：关</span>
    </button>
    <div class="layoutbar">
      <div class="keychips" id="layoutStrategy" title="可多选：按顺序层层叠加成复合策略，只搬图标位置，不动任何文件"></div>

            让 AI 提建议

<div class="toast" id="toast"></div>

<script>
const CATS = ["图片","文档","表格","演示","PDF","音视频","压缩包","安装包","代码","快捷方式","字体","电子书","其他"];
const IMP_LABEL = {high:"重要", medium:"常用", low:"归档"};
const CAT_COLOR = {
  "图片":"#6d5efc","文档":"#a855f7","表格":"#22d3ee","演示":"#fbbf24","PDF":"#fb7185",
  "音视频":"#34d399","压缩包":"#f97316","安装包":"#e879f9","代码":"#38bdf8",
  "快捷方式":"#94a3b8","字体":"#c084fc","电子书":"#2dd4bf","其他":"#64748b"
};

const $ = (id) => document.getElementById(id);
const state = { rows: [], selected: new Set(), planned: false, lastJournal: "", query: "", sort: "name", cat: "", layoutKeys: ["system_first", "shortcuts_first", "by_name"] };
let api = null;
let suggestions = [];

function log(msg, kind){
  const el = $("log");
  const t = new Date().toLocaleTimeString("zh-CN", {hour12:false});
  const cls = kind ? ` class="${kind}"` : "";
  el.insertAdjacentHTML("beforeend", `\n<span class="t">[${t}]</span> <span${cls}>${esc(msg)}</span>`);
  el.scrollTop = el.scrollHeight;
}
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 2400);
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtSize(n){
  if (!n) return "0 B";
  const u = ["B","KB","MB","GB"]; let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return `${v.toFixed(i ? 1 : 0)} ${u[i]}`;
}
function fmtTime(ms){
  if (!ms) return "";
  const d = new Date(ms * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

// ---------- 进度（后端推流，只显示百分比）----------
window.onProgress = function (p) {
  if (!p) return;
  const pct = Math.max(0, Math.min(100, Number(p.percent) || 0));
  $("progFill").style.width = pct + "%";
  $("progPct").textContent = pct + "%";
  const name = {scan:"扫描", plan:"生成计划", ai_analyzing:"AI 分析中", apply:"执行移动", rollback:"回滚"}[p.stage] || p.stage || "";
  $("progHint").textContent = p.message ? `${name} · ${p.message}` : name || "就绪";
};

// ---------- 过滤与排序 ----------
/** 当前可见行（受搜索词、类别筛选与排序影响）。选中状态存的是 path，所以过滤不影响已选。 */
function viewRows(){
  const q = state.query.trim().toLowerCase();
  let out = state.rows.filter((r) => !state.cat || r.category === state.cat);
  if (q) out = out.filter((r) => String(r.name || "").toLowerCase().includes(q));
  else out = out.slice();
  const byName = (a, b) => String(a.name || "").localeCompare(String(b.name || ""), "zh-CN");
  const byTime = (a, b) => (a.mtime || 0) - (b.mtime || 0);
  const bySize = (a, b) => (a.size || 0) - (b.size || 0);
  const cmp = {
    "name": byName,
    "name-desc": (a, b) => byName(b, a),
    "mtime": byTime,
    "mtime-desc": (a, b) => byTime(b, a),
    "size-desc": (a, b) => bySize(b, a),
  }[state.sort] || byName;
  return out.sort(cmp);
}

// ---------- 左栏：环形图与类别筛选 ----------
function paintNav(){
  const total = state.rows.length;
  const byCat = new Map();
  let sum = 0;
  state.rows.forEach((r) => {
    const c = r.category || "其他";
    const size = r.size || 0;
    byCat.set(c, (byCat.get(c) || 0) + size);
    sum += size;
  });
  const ordered = [...byCat.entries()].sort((a, b) => b[1] - a[1]);
  let acc = 0;
  const stops = ordered.filter(([, v]) => v > 0).map(([c, v]) => {
    const from = (acc / Math.max(sum, 1)) * 360;
    acc += v;
    const to = (acc / Math.max(sum, 1)) * 360;
    return `${CAT_COLOR[c] || "#64748b"} ${from.toFixed(2)}deg ${to.toFixed(2)}deg`;
  });
  $("donut").style.background = stops.length
    ? `conic-gradient(${stops.join(",")})`
    : "conic-gradient(rgba(255,255,255,.08) 0turn, rgba(255,255,255,.08) 1turn)";
  $("donutText").textContent = fmtSize(sum);
  $("donutCount").textContent = `${ordered.length} 类`;

  const rows = [[{cat:"", label:"全部文件", size:sum, n:total}]];
  const head = `<div class="catrow${state.cat ? "" : " on"}" data-cat="">
      <span class="swatch" style="background:linear-gradient(135deg,#6d5efc,#a855f7)"></span>
      <span>全部文件</span><span class="num">${total}</span></div>`;
  const rest = ordered.map(([c, size]) => `<div class="catrow${state.cat === c ? " on" : ""}" data-cat="${esc(c)}">
      <span class="swatch" style="background:${CAT_COLOR[c] || "#64748b"}"></span>
      <span>${esc(c)}</span><span class="num">${fmtSize(size)}</span></div>`).join("");
  $("navCats").innerHTML = head + rest;
  paintCatPick(ordered.map(([c]) => c));
}

// 类别下拉：和左侧图例同一份数据，选一个就能批量勾选
function paintCatPick(cats){
  const sel = $("catPick");
  const keep = sel.value;
  sel.innerHTML = `<option value="">按类别勾选…</option>` +
    cats.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  if (keep && cats.includes(keep)) sel.value = keep;
  $("btnCatAll").disabled = !sel.value;
}

// 勾选当前类别下「看得见的那几行」（搜索/筛选后的结果，符合眼睛看到的东西）
function selectByCategory(cat){
  const hits = viewRows().filter((r) => r.action_id && r.category === cat);
  if (!hits.length){
    toast(`「${cat}」下没有可勾选的文件`);
    return;
  }
  hits.forEach((r) => state.selected.add(r.path));
  render();
  log(`按类别勾选「${cat}」：${hits.length} 个`, "ok");
}

// ---------- 渲染 ----------
function render(){
  const list = $("list");
  if (!state.rows.length){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <div>点击下方「扫描」开始</div></div>`;
    stats();
    return;
  }
  const view = viewRows();
  if (!view.length){
    list.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <div>没有匹配的文件</div></div>`;
    stats();
    return;
  }
  list.innerHTML = view.map((r) => {
    const i = state.rows.indexOf(r);
    const on = state.selected.has(r.path);
    const skip = !!r.skipped_reason && !r.action_id;
    const cls = ["row", on ? "on" : "", skip ? "skip" : ""].filter(Boolean).join(" ");
    const conf = r.confidence || 0;
    const low = conf < 0.55 ? " low" : "";
    const meta = [
      r.target_dir || "—",
      r.size ? fmtSize(r.size) : "",
      r.mtime ? fmtTime(r.mtime) : "",
    ].filter(Boolean).join(" · ");
    return `<div class="${cls}" data-i="${i}">
      <div class="cb"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="fname">
        <b title="${esc(r.path)}">${esc(r.name)}</b>
        <span>${esc(meta)}</span>
      </div>
      <span class="tag">${esc(r.category || "其他")}</span>
      <span class="tag ${r.importance === "high" ? "h" : r.importance === "medium" ? "m" : "l"}">${esc(IMP_LABEL[r.importance] || "归档")}</span>
      <span class="conf"><span class="bar"><i class="${low}" style="width:${Math.round(conf * 100)}%"></i></span>${Math.round(conf * 100)}%</span>
      <div class="edit" data-edit="${i}" title="改判并记住">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </div>
    </div>`;
  }).join("");
  stats();
}

function stats(){
  const total = state.rows.length;
  const sel = state.selected.size;
  const filtered = !!(state.query || "").trim() || !!state.cat;
  const shown = filtered ? viewRows().length : total;
  const high = state.rows.filter((r) => r.confidence >= 0.8).length;
  const low = state.rows.filter((r) => r.confidence > 0 && r.confidence < 0.55).length;
  $("stTotal").textContent = total;
  $("stSel").textContent = sel;
  $("stHigh").textContent = high;
  $("stLow").textContent = low;
  $("cntText").textContent = filtered ? `${shown} / ${total}` : total;
  $("selText").textContent = `已选 ${sel}`;
  $("btnPlan").disabled = total === 0;
  $("btnDry").disabled = sel === 0;
  $("btnRun").disabled = sel === 0;
  $("btnBack").disabled = !state.lastJournal;
  $("btnBulk").disabled = sel === 0;
  $("btnSelAll").disabled = shown === 0;
  $("btnSelNone").disabled = sel === 0;
  paintNav();
}

// ---------- 交互 ----------
$("list").addEventListener("click", (e) => {
  const edit = e.target.closest("[data-edit]");
  if (edit){ openEdit(Number(edit.dataset.edit)); return; }
  const rowEl = e.target.closest(".row");
  if (!rowEl) return;
  const r = state.rows[Number(rowEl.dataset.i)];
  if (!r || !r.action_id){ toast("这个条目不可移动（目录或已跳过）"); return; }
  if (state.selected.has(r.path)) state.selected.delete(r.path);
  else state.selected.add(r.path);
  render();
});

$("navCats").addEventListener("click", (e) => {
  const el = e.target.closest("[data-cat]");
  if (!el) return;
  state.cat = el.dataset.cat || "";
  state.query = "";
  $("q").value = "";
  render();
});

async function scan(){
  try{
    const res = await api.scan();
    state.rows = res.rows || [];
    state.planned = false;
    $("rootText").textContent = res.root || "—";
    log(`扫描完成：${res.total} 个条目`);
    render();
    if (state.rows.length) await plan();   // 扫完直接出建议，少点一次
  }catch(err){ log(`扫描失败：${err}`, "bad"); }
}

async function plan(){
  try{
    const res = await api.plan();
    state.rows = res.rows || [];
    const have = new Set(state.rows.filter((r) => r.action_id).map((r) => r.path));
    // 不再默认勾选：勾什么由用户决定。这里只把已经失效的选中项剔掉。
    state.selected = new Set([...state.selected].filter((p) => have.has(p)));
    state.planned = true;
    if (res.warnings && res.warnings.length) log(res.warnings.join("；"), "warn");
    log(`计划已生成：${res.total} 个可执行移动；未默认勾选，请用勾选框或「按搜索词全选」逐项确认`);
    render();
  }catch(err){ log(`生成计划失败：${err}`, "bad"); }
}

function actionIds(){
  return state.rows.filter((r) => state.selected.has(r.path) && r.action_id).map((r) => r.action_id);
}

async function apply(dryRun){
  const ids = actionIds();
  if (!ids.length){ toast("先选文件"); return; }
  if (!dryRun && !confirm(`确定要真正移动 ${ids.length} 个文件吗？\n\n移动记录会写入日志，随时可以一键回滚。`)) return;
  try{
    const res = await api.apply(ids, dryRun);
    if (res.dry_run){
      log(`预览：将移动 ${res.applied} 个文件，未写盘`, "ok");
      toast(`预览 ${res.applied} 个（未落盘）`);
    }else{
      state.lastJournal = res.journal_id || state.lastJournal;
      log(`已移动 ${res.applied} 个文件，日志 ${res.journal_id}`, "ok");
      toast(`已移动 ${res.applied} 个`);
      await scan();
    }
    (res.errors || []).forEach((e) => log(`跳过/失败：${e}`, "warn"));
    stats();
  }catch(err){ log(`执行失败：${err}`, "bad"); }
}

async function rollback(){
  try{
    const res = await api.rollback(state.lastJournal);
    log(`回滚完成：恢复 ${res.rolled_back} 个（文件名与修改时间均已还原）`, "ok");
    const ic = res.icons;
    if (ic && ic.restored){
      log(`图标位置：已按整理前的快照还原 ${ic.restored} 个` + (ic.skipped ? `，${ic.skipped} 个没找到` : ""), ic.skipped ? "warn" : "ok");
      if (ic.verified === false) log(`注意：仍有 ${(ic.mismatched || []).length} 个图标未就位`, "warn");
      if (ic.autoarrange_was_on){
        log("注意：桌面「自动排列图标」当时是开着的，已临时关闭以便写回位置；重新打开会自动重排。", "warn");
      }
    }else if (ic){
      log("图标位置：这次没有可写回的坐标（快照为空或图标都已不存在）", "warn");
    }else{
      log("图标位置：该次整理没有保存坐标快照，只还原了文件与时间戳", "warn");
    }
    toast(`已恢复 ${res.rolled_back} 个`);
    (res.errors || []).forEach((e) => log(`跳过/失败：${e}`, "warn"));
    state.lastJournal = "";
    await scan();
  }catch(err){ log(`回滚失败：${err}`, "bad"); }
}

function openEdit(i){
  const r = state.rows[i];
  if (!r) return;
  const sel = $("mCat");
  sel.innerHTML = CATS.map((c) => `<option value="${esc(c)}"${c === r.category ? " selected" : ""}>${esc(c)}</option>`).join("");
  $("mImp").value = r.importance || "medium";
  $("mDir").value = r.target_dir || `${r.category}/${IMP_LABEL[r.importance] || "常用"}`;
  $("mPath").textContent = r.path;
  $("modal").classList.add("on");
  $("modal").dataset.i = i;
}

async function saveEdit(){
  const i = Number($("modal").dataset.i);
  const r = state.rows[i];
  if (!r) return;
  const category = $("mCat").value;
  const importance = $("mImp").value;
  const target_dir = $("mDir").value || `${category}/${IMP_LABEL[importance]}`;
  try{
    const res = await api.remember(r.path, category, importance, target_dir);
    if (!res.saved){ toast(res.error || "保存失败"); return; }
    const fresh = await api.plan_for(r.path);
    if (fresh) state.rows[i] = { ...state.rows[i], ...fresh };
    state.selected.add(r.path);
    $("modal").classList.remove("on");
    log(`已记住改判：${r.name} → ${target_dir}`, "ok");
    toast("已记住，下次同类文件沿用");
    render();
  }catch(err){ log(`保存失败：${err}`, "bad"); }
}

// ---------- 批量改去向 ----------
async function bulkMove(){
  const dir = ($("bulkDir").value || "").trim();
  if (!dir){ toast("先填一个目标目录"); return; }
  const paths = [...state.selected];
  if (!paths.length){ toast("先选文件"); return; }
  try{
    const res = await api.set_target_dir_bulk(paths, dir);
    if (!res.ok){ log(`批量改去向失败：${res.error}`, "bad"); toast(res.error || "失败"); return; }
    state.rows = (res.plan && res.plan.rows) || state.rows;
    log(`已把 ${res.updated} 个文件的目标目录改为「${res.target_dir}」`, "ok");
    toast(`已改 ${res.updated} 个的去向`);
    render();
  }catch(err){ log(`批量改去向失败：${err}`, "bad"); }
}

// ---------- AI 顾问 ----------
function paintAI(cfg){
  if (!cfg) return;
  $("aiProvider").value = cfg.provider || "off";
  $("aiModel").value = cfg.model || "";
  $("aiBase").value = cfg.base_url || "";
  $("aiKey").value = "";
  $("aiKey").placeholder = cfg.has_key ? "已保存（留空则沿用）" : "粘贴你的 API Key";
  $("aiStatus").textContent = cfg.provider === "off" ? "本地规则" : (cfg.has_key ? "已配置" : "缺 Key");
}

async function loadAI(){
  try{ paintAI(await api.ai_settings()); }
  catch(err){ log(`读取 AI 配置失败：${err}`, "bad"); }
}

async function saveAI(){
  try{
    const cfg = await api.save_ai_settings(
      $("aiProvider").value,
      $("aiKey").value || "",
      $("aiBase").value || "",
      $("aiModel").value || "",
      null
    );
    paintAI(cfg);
    log("AI 配置已保存", "ok");
    toast("已保存");
  }catch(err){ log(`保存 AI 配置失败：${err}`, "bad"); }
}

function paintSuggestions(rows){
  suggestions = rows || [];
  if (!suggestions.length){
    $("aiList").innerHTML = `<div class="sug"><span>没有建议。</span></div>`;
    $("btnAdoptAll").disabled = true;
    return;
  }
  $("aiList").innerHTML = suggestions.map((s) => `<div class="sug">
      <b title="${esc(s.path)}">${esc(s.name || s.path)}</b>
      <span>→ <span class="to">${esc(s.target_dir)}</span> · ${Math.round((s.confidence || 0) * 100)}%</span>
      ${s.reason ? `<span> · ${esc(s.reason)}</span>` : ""}
    </div>`).join("");
  $("btnAdoptAll").disabled = false;
}

async function askAI(){
  try{
    $("btnAI").disabled = true;
    $("aiStatus").textContent = "分析中…";
    const res = await api.ai_suggest();
    paintSuggestions(res.suggestions || []);
    if (res.degraded) log(`AI 暂不可用，已回落本地规则：${res.reason}`, "warn");
    else log(`AI 给出 ${res.suggestions.length} 条建议，可一键采纳`, "ok");
    $("aiStatus").textContent = res.degraded ? "本地规则" : "AI 已回复";
  }catch(err){ log(`AI 分析失败：${err}`, "bad"); $("aiStatus").textContent = "出错"; }
  finally{ $("btnAI").disabled = false; }
}

async function adoptAI(){
  if (!suggestions.length){ toast("还没有建议"); return; }
  try{
    const res = await api.apply_suggestions(suggestions);
    if (!res.ok){ log(`采纳失败：${res.error}`, "bad"); toast(res.error || "失败"); return; }
    state.rows = (res.plan && res.plan.rows) || state.rows;
    log(`已采纳 AI 建议：${res.updated} 个文件的目标目录已更新`, "ok");
    toast(`已采纳 ${res.updated} 个`);
    render();
  }catch(err){ log(`采纳失败：${err}`, "bad"); }
}

// ---------- 写盘许可（默认关闭，用户亲手点亮） ----------
let permitOn = false;

function paintPermit(){
  const btn = $("btnPermit");
  btn.classList.toggle("on", permitOn);
  $("permitText").textContent = permitOn ? "用户目录写入：开" : "用户目录写入：关";
  btn.title = permitOn
    ? "已允许写入桌面等用户目录，执行前请再确认一遍勾选项"
    : "默认关闭：不加锁就不能整理真实桌面";
}

async function refreshPermit(){
  try{
    const res = await api.settings();
    permitOn = !!(res && res.allow_user_dirs);
    paintPermit();
    if (!permitOn) log("写盘许可：关闭（只能预览，不能真正移动）", "warn");
  }catch(err){ log(`读取设置失败：${err}`, "bad"); }
}

async function togglePermit(){
  const next = !permitOn;
  if (next && !confirm("打开后，执行移动会真的改动桌面文件。\n回滚可用，但仍建议先只勾一个类别试水。\n\n确定要打开吗？")) return;
  try{
    const res = await api.set_allow_user_dirs(next);
    permitOn = !!(res && res.allow_user_dirs);
    paintPermit();
    log(permitOn ? "写盘许可：已打开，可以执行移动了" : "写盘许可：已关闭，执行会被拦截", permitOn ? "ok" : "warn");
  }catch(err){ log(`切换许可失败：${err}`, "bad"); }
}

// ---------- 绑定 ----------
$("btnScan").onclick = scan;
$("btnPlan").onclick = plan;
$("btnDry").onclick = () => apply(true);
$("btnRun").onclick = () => apply(false);
$("btnBack").onclick = rollback;
$("btnBulk").onclick = bulkMove;
$("btnSaveAI").onclick = saveAI;
$("btnAI").onclick = askAI;
$("btnAdoptAll").onclick = adoptAI;
$("btnSelAll").onclick = () => {
  // 只勾当前可见（受搜索/类别影响）的可移动项：搜到哪个类别就批量勾哪个，不会误勾看不见的行
  viewRows().forEach((r) => { if (r.action_id) state.selected.add(r.path); });
  render();
};
$("btnSelNone").onclick = () => {
  state.selected.clear();
  render();
};
$("q").addEventListener("input", (e) => { state.query = e.target.value || ""; render(); });
$("q").addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  e.target.value = "";
  state.query = "";
  render();
});
$("sortBy").addEventListener("change", (e) => { state.sort = e.target.value; render(); });
$("mCancel").onclick = () => $("modal").classList.remove("on");
$("btnPermit").onclick = togglePermit;
$("btnLayout").onclick = applyLayout;
$("btnUndoLayout").onclick = undoLayout;
$("layoutStrategy").addEventListener("click", (e) => {
  const chip = e.target.closest(".keychip");
  if (chip) toggleKey(chip.dataset.key);
});
$("catPick").addEventListener("change", () => {
  $("btnCatAll").disabled = !$("catPick").value;
});
$("btnCatAll").onclick = () => {
  const cat = $("catPick").value;
  if (cat) selectByCategory(cat);
};
$("mSave").onclick = saveEdit;
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").classList.remove("on"); });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") $("modal").classList.remove("on");
  if (e.key === "Enter" && $("modal").classList.contains("on")) saveEdit();
});
$("mCat").addEventListener("change", () => {
  const c = $("mCat").value;
  $("mDir").value = `${c}/${IMP_LABEL[$("mImp").value] || "常用"}`;
});
$("mImp").addEventListener("change", () => {
  $("mDir").value = `${$("mCat").value}/${IMP_LABEL[$("mImp").value] || "常用"}`;
});

// ---------- 一键整理图标（只搬坐标，不动文件） ----------
function showUndoToast(msg){
  const el = $("toast");
  el.innerHTML = `${esc(msg)}<button class="undo" id="toastUndo">撤销</button>`;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 9000);
  $("toastUndo").onclick = async () => {
    el.classList.remove("on");
    await undoLayout();
  };
}

async function loadLayoutStrategies(){
  if (!api) return;
  try{
    const rows = await api.get_layout_sort_keys();
    $("layoutStrategy").innerHTML = rows.map((r) =>
      `<button class="keychip${state.layoutKeys.includes(r.id) ? " on" : ""}" data-key="${esc(r.id)}" title="${esc(r.desc)}">${esc(r.name)}<span class="ord" data-ord="${esc(r.id)}">${orderOf(r.id)}</span></button>`
    ).join("");
  }catch(err){
    log(`读取排版选项失败：${err}`, "err");
  }
}

// 多选的先后就是叠加顺序：先选的先起作用
function orderOf(id){
  const i = state.layoutKeys.indexOf(id);
  return i < 0 ? "" : String(i + 1);
}

function paintKeys(){
  document.querySelectorAll("#layoutStrategy .keychip").forEach((el) => {
    const id = el.dataset.key;
    el.classList.toggle("on", state.layoutKeys.includes(id));
    const ord = el.querySelector(".ord");
    if (ord) ord.textContent = orderOf(id);
  });
}

function toggleKey(id){
  const i = state.layoutKeys.indexOf(id);
  if (i >= 0) state.layoutKeys.splice(i, 1);
  else state.layoutKeys.push(id);
  paintKeys();
}

async function applyLayout(){
  if (!api) return;
  if (!state.layoutKeys.length){
    toast("至少选一个排版选项");
    return;
  }
  const keys = [...state.layoutKeys];
  try{
    const res = await api.apply_desktop_layout("", keys, false);
    if (!res || !res.ok){
      toast((res && res.error) || "排版失败");
      log((res && res.error) || "排版失败", "err");
      return;
    }
    const extra = res.errors && res.errors.length ? `，${res.errors.length} 条提示` : "";
    showUndoToast(`已按「${res.strategy}」排好 ${res.moved}/${res.total} 个图标${extra}`);
    log(`图标排版完成：${res.moved}/${res.total}（${res.strategy}）${extra}`);
    (res.errors || []).forEach((e) => log(e, "warn"));
  }catch(err){
    log(`排版出错：${err}`, "err");
  }
}

async function undoLayout(){
  if (!api) return;
  try{
    const res = await api.undo_desktop_layout();
    if (!res || !res.ok){
      toast((res && res.error) || "撤销失败");
      log((res && res.error) || "撤销失败", "err");
      return;
    }
    toast(`已撤销排版：${res.restored} 个图标回到原位`);
    log(`撤销排版：恢复 ${res.restored} 个，校验 ${res.verified === false ? "未通过" : "通过"}`);
  }catch(err){
    log(`撤销出错：${err}`, "err");
  }
}

// pywebview 注入完成后启动
function boot(){
  api = window.pywebview.api;
  log("界面就绪，等待扫描。");
  refreshPermit();
  loadAI();
  paintNav();
  loadLayoutStrategies();
}
if (window.pywebview && window.pywebview.api){
  boot();
}else{
  window.addEventListener("pywebviewready", boot);
}
</script>
</body>
</html>
